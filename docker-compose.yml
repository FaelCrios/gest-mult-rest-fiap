services:
  db:
    image: postgres:15
    container_name: tech_challenge_db
    environment:
      POSTGRES_DB: restaurante_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: tech_challenge_api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/restaurante_db
    depends_on:
      - db